services:
  - type: web
    name: nimbus-api
    runtime: docker
    plan: free
    region: singapore

    dockerfilePath: ./Dockerfile

    healthCheckPath: /health

    envVars:
      - key: DB_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nimbus-redis
          property: connectionString

      - key: BASE_URL
        sync: false

      - key: ALLOWED_ORIGIN
        sync: false

databases:
  - name: nimbus-db
    plan: free
    region: singapore

    databaseName: nimbus
    user: nimbus

  - name: nimbus-redis
    plan: free
    region: singapore