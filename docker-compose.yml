services:
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://nimbus:nimbuspass@postgres:5432/nimbus?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nimbus-api

    ports:
      - "${API_PORT:-8080}:8080"

    environment:
      DB_URL: ${DB_URL}
      REDIS_URL: ${REDIS_URL}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine

    container_name: nimbus-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbuspass}
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nimbus} -d ${POSTGRES_DB:-nimbus}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: nimbus-redis

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: